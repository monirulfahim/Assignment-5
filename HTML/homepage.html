<!doctype html>
<html class="bg-[#F8FAFC]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- Tailwind + Daisy UI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
    </style>
  </head>
  <body>
    <header class="flex justify-between items-center px-20 py-4">
        <div class="flex gap-3 justify-center items-center">
            <div> 
                <img class="w-14" src="../assets/github-logo.png" alt="">
            </div>
            <div> 
                <h1 class="font-semibold text-3xl">GitHub Issues Tracker</h1>
            </div>
        </div>
        <div class="flex gap-5 justify-center items-center">
            <div> 
                <input class="px-14 pl-2 py-2.5 text-xl rounded" type="text" placeholder="🔍 Search issues...">
            </div>
            <div> 
                <button class="btn btn-primary py-6 text-xl p-3 rounded font-semibold">+ New Issue</button>
            </div>
        </div>
    </header>
    <main class="px-[245px] py-[60px]">
        <div class="bg-[#FFFFFF] p-6 rounded">
            <button onclick="toggleStyle('tab-all')" id="tab-all" class="filter-btn text-[#FFFFFF] bg-[#4A00FF]  px-12 py-2 rounded mr-2.5 cursor-pointer border border-gray-300">All</button>
            <button onclick="toggleStyle('tab-open')" id="tab-open" class="filter-btn text-[#64748B] bg-[#FFFFFF] px-12 py-2 rounded mr-2.5 cursor-pointer border border-gray-300">Open</button>
            <button onclick="toggleStyle('tab-close')" id="tab-close" class="filter-btn text-[#64748B] bg-[#FFFFFF] px-12 py-2 rounded mr-2.5 cursor-pointer border border-gray-300">Close</button>
        </div>

    </main>

    <script src="../script/home.js"></script>
    <script src="../script/signin.js"></script>
  </body>
</html>
