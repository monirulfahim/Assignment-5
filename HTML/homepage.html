<!doctype html>
<html class="bg-[#F8FAFC]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- Tailwind + Daisy UI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
    </style>
  </head>
  <body>
    <header class="flex flex-col sm:flex-row justify-between items-center px-4 sm:px-20 py-4 gap-4">
        <div class="flex gap-3 justify-center items-center">
            <div> 
                <img class="w-14" src="../assets/github-logo.png" alt="">
            </div>
            <div> 
                <h1 class="font-semibold text-3xl">GitHub Issues Tracker</h1>
            </div>
        </div>
        <div class="flex gap-5 justify-center items-center">
            <div> 
                <input id="search" class="px-14 pl-2 py-2.5 text-xl rounded" type="text" placeholder="🔍 Search issues...">
            </div>
            <div> 
                <button class="btn btn-primary py-6 text-xl p-3 rounded font-semibold">+ New Issue</button>
            </div>
        </div>
    </header>
    <main class="mx-auto max-w-[1380px]">
        <div class="bg-[#FFFFFF] p-6 rounded mb-4">
            <button onclick="toggleStyle('tab-all')" id="tab-all" class="filter-btn text-[#FFFFFF] bg-[#4A00FF]  px-12 py-2 rounded mr-2.5 cursor-pointer border border-gray-300 font-semibold">All</button>
            <button onclick="toggleStyle('tab-open')" id="tab-open" class="filter-btn text-[#64748B] bg-[#FFFFFF] px-12 py-2 rounded mr-2.5 cursor-pointer border border-gray-300 font-semibold">Open</button>
            <button onclick="toggleStyle('tab-close')" id="tab-close" class="filter-btn text-[#64748B] bg-[#FFFFFF] px-12 py-2 rounded mr-2.5 cursor-pointer border border-gray-300 font-semibold">Close</button>
        </div>
        <section>
            <div class="flex justify-between items-center p-6 bg-[#FFFFFF] rounded">
                <div class="flex justify-between items-center gap-2"> 
                    <div class="w-12"> 
                        <img src="../assets/Group 1.png" alt="">
                    </div>
                    <div>
                        <h5 class="font-semibold text-2xl"><span id="total">50</span> Issues</h5>
                        <p class="text-[16px] text-[#64748B]">Track and manage your project issues</p>
                    </div>
                </div>
                <div class="flex justify-between items-center gap-3"> 
                    <div class="flex justify-between items-center gap-2">
                        <div>
                            <img src="../assets/Ellipse 2.png" alt="">
                        </div>
                        <div>
                            Open
                        </div>
                    </div>
                    <div class="flex justify-between items-center gap-2">
                        <div>
                            <img src="../assets/Ellipse 2 (1).png" alt="">
                        </div>
                        <div>
                            Closed
                        </div>
                    </div>
                </div>
            </div>
            <hr class="grow border-gray-300">
        </section>

        <section id="all-issues" class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-stretch">
            
        </section>

        <div id="issueModel" class="fixed inset-0 hidden items-center justify-center bg-white/5 backdrop-blur-sm">
            <div class="bg-white w-[650px] p-8 rounded-xl shadow-lg">

                <h2 id="modelTitle" class="text-3xl font-bold mb-3"></h2>

        <div class="flex items-center gap-3 mb-3">
            <span class="bg-green-600 text-white px-3 py-1 rounded-full text-sm">Opened</span>
            <p>Opened by <span id="modelAuthor"></span></p>
            <p id="modelDate"></p>
        </div>

        <div id="modelLabels" class="flex gap-2 mb-4"></div>

        <p id="modelDescription" class="text-gray-600 mb-6"></p>

        <div class="flex justify-between bg-gray-100 p-4 rounded-lg">
            <p><strong>Assignee:</strong> <span id="modelAssignee"></span></p>
            <p><strong>Priority:</strong> <span id="modelPriority"></span></p>
        </div>

        <div class="text-right mt-6">
            <button id="closeModel" class="bg-[#4A00FF] text-white px-6 py-2 rounded-lg">
                Close
            </button>
    </div>

  </div>
</div>
    </main>

    <script src="../script/home.js"></script>
  </body>
</html>
